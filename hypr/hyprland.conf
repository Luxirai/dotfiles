monitor = DP-2,3840x2160@60,0x0,auto
monitor = HDMI-A-3,preferred,auto-right,1

# Pin numbered workspaces to the main 4K monitor so the secondary
# monitor can never pull them away when it has focus.
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-2

# Secondary monitor gets its own dedicated workspace.
workspace = 11, monitor:HDMI-A-3, default:true, persistent:true

exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = waybar
exec-once = awww-daemon
exec-once = swaync
exec-once = wl-paste --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

source = ~/.config/hypr/environment.conf
source = ~/.config/hypr/ui.conf
source = ~/.config/hypr/devices.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf

xwayland {
  force_zero_scaling = true
}

ecosystem {
  no_donation_nag = true
}
bind = , Insert, global, :dictate-hold
