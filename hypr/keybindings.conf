$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$mod = SUPER
$modshift = SUPER_SHIFT

# -------------
# ---PROGRAMS--
# -------------
bind = $mod, Return, exec, $terminal
bind = $mod, B, exec, brave

# -------------
# ---GENERAL---
# -------------
bind = $mod, Q, killactive,
bind = $modshift, Q, forcekillactive
bind = $mod, W, closewindow
bind = $mod, F, fullscreen, 0
bind = $mod, M, exit ,
bind = $mod, E, exec, $fileManager
bind = $mod, V, togglefloating,
bind = $modshift, V, exec, cliphist list | wofi -d | cliphist decode | wl-copy
bind = $mod, Space, exec, $menu
bind = $mod, P, pseudo, # dwindle
bind = $mod, t, layoutmsg, togglesplit # dwindle
bind = $mod, F4, exec, systemctl suspend
bind = $modshift, equal, exec, hyprctl keyword monitor DP-2,3840x2160@60,0x0,2.5
bind = $modshift, minus, exec, hyprctl keyword monitor DP-2,3840x2160@60,0x0,auto
bind = $modshift, Space, exec, hyprshot -m region --clipboard-only
bind = $modshift ctrl, Space, exec, hyprshot -m window --clipboard-only
bind = $modshift, BackSpace, exec, killall -SIGUSR1 waybar




# -------------
# ---WINDOWS---
# -------------


bind = $mod, tab, focuscurrentorlast

# FOCUS
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# MOVE AROUND
bind = $modshift, l, movewindow, r
bind = $modshift, h, movewindow, l
bind = $modshift, k, movewindow, u
bind = $modshift, j, movewindow, d

# RESIZE
bind = $mod, R, submap, resize
submap = resize
binde = , l, resizeactive, 20 0
binde = , h, resizeactive, -20 0
binde = , k, resizeactive, 0 -20
binde = , j, resizeactive, 0 20
bind = ,escape, submap, reset
bind = $mod, R, submap, reset
submap = reset


# -------------
# --WORKSPACES-
# -------------

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mod, C, togglespecialworkspace, magic
bind = $mod SHIFT, C, movetoworkspace, special:magic

# Scroll through existing workspaces with mod + scroll
bind = $mod, mouse_right, workspace, e+1
bind = $mod, mouse_left, workspace, e-1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# AUDIO
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# PLAYER - Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# DEV 
bind = $modshift, W, exec, pkill waybar && waybar &

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace
